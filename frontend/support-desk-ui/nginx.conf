# Docker's embedded DNS server. Using it explicitly, combined with the
# variable + proxy_pass pattern below, makes nginx resolve "backend" at
# request time instead of once at startup - so nginx won't crash if the
# backend container isn't up yet when the frontend container starts.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    # Proxy API calls to the backend container.
    # Uses the Compose service name "backend", not localhost - inside the
    # Docker network, "backend" resolves to the backend container itself.
    location /api/ {
        set $backend_upstream http://backend:8081;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the built React app, falling back to index.html for any route
    # React Router handles client-side (e.g. /tickets/123 on a hard refresh).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}