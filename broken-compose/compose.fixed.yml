# Fixed version of compose.broken.yml for Day 18 Exercise 05.
# Three bugs corrected - see the troubleshooting report for details.

services:
  mongo:
    image: mongo:8
    container_name: support-desk-mongo-lab
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27019}:27017"
    volumes:
      - mongo_lab_data:/data/db
      - ../mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../support-desk-api
    container_name: support-desk-backend-lab
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      # Fix 1: was "localhost" - inside the backend's own container that
      # means itself, not the mongo service. Must be the service name.
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: support_desk_db
      MONGODB_AUTHENTICATION_DATABASE: support_desk_db
      MONGODB_USERNAME: support_app_user
      # Fix 2: was "MONGO_PASSWORD" - application.properties reads
      # ${MONGODB_PASSWORD}, so the misnamed key was never actually seen
      # by Spring Boot, causing a placeholder resolution crash at startup.
      MONGODB_PASSWORD: supportPwd123
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-this-in-production-1234567890}
    ports:
      - "${BACKEND_PORT:-8082}:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend/support-desk-ui
    container_name: support-desk-frontend-lab
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      # Fix 3: was ":8080" - nginx.conf actually listens on port 80 inside
      # the container, so nothing was listening on 8080. The healthcheck
      # still passed because it runs inside the container against nginx's
      # real port (80) directly, not through this host mapping - proving
      # "healthy" in docker compose ps isn't the same as "reachable".
      - "${FRONTEND_PORT:-5175}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_lab_data: