# Broken Docker Compose file for Day 18 troubleshooting lab (Support Desk
# edition - adapted from the trainer's asset-tracker template, since that
# project's files/context were unavailable). This file is intentionally
# wrong in several places. Diagnose using docker compose ps/logs, then
# create compose.fixed.yml - do not edit this file directly.

services:
  mongo:
    image: mongo:8
    container_name: support-desk-mongo-lab
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27019}:27017"
    volumes:
      - mongo_lab_data:/data/db
      - ../mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../support-desk-api
    container_name: support-desk-backend-lab
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      MONGODB_HOST: localhost
      MONGODB_PORT: 27017
      MONGODB_DATABASE: support_desk_db
      MONGODB_AUTHENTICATION_DATABASE: support_desk_db
      MONGODB_USERNAME: support_app_user
      MONGO_PASSWORD: supportPwd123
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-this-in-production-1234567890}
    ports:
      - "${BACKEND_PORT:-8082}:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend/support-desk-ui
    container_name: support-desk-frontend-lab
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5175}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_lab_data: